<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Faviconlogoart.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Tarjeta Digital de Fidelización LogoArtCR</title>
  <meta name="description" content="Consulta tu tarjeta digital de fidelización y el avance de tu recompensa.">

  <!-- Open Graph (Vista previa en WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tarjeta Digital de Fidelización LogoArtCR">
  <meta property="og:description" content="Consulta tu tarjeta digital de fidelización y el avance de tu recompensa.">
  <meta property="og:url" content="https://logoartcr.github.io/Tarjeta-Fidelizacion/">
  <meta property="og:image" content="https://logoartcr.github.io/Tarjeta-Fidelizacion/Faviconlogoart.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020305;
    }

    #mi-tarjeta {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="mi-tarjeta" src=""></iframe>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const idTarjeta = (urlParams.get('id') || '').trim();

    let urlFinal = "https://script.google.com/macros/s/AKfycbxtJ6bYj9CdefxFj7SFxu38rArK0zMWaWArjQTaZQWKz0kXJbyLleqLE46iubi-qzLT/exec";

    if (idTarjeta) {
      const conector = urlFinal.includes('?') ? '&' : '?';
      urlFinal += conector + "id=" + encodeURIComponent(idTarjeta);
    }

    document.getElementById('mi-tarjeta').src = urlFinal;
  </script>

</body>
</html>
