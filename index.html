    function installMobileScrollWakeFix() {
      const mobileQuery = window.matchMedia('(max-width: 620px)');

      if (!mobileQuery.matches) {
        return;
      }

      let wakeTimer = null;

      function wakeScrollLayer() {
        document.documentElement.classList.add('scroll-awake');

        clearTimeout(wakeTimer);
        wakeTimer = setTimeout(function () {
          document.documentElement.classList.remove('scroll-awake');
        }, 420);
      }

      window.addEventListener('touchstart', wakeScrollLayer, { passive: true });
      window.addEventListener('touchmove', wakeScrollLayer, { passive: true });
      window.addEventListener('scroll', wakeScrollLayer, { passive: true });
    }

    function loadCard() {
      currentCardId = getCardIdFromUrl();

      if (!currentCardId) {
        renderError('No se recibió el ID de la tarjeta. Usa el formato ?id=DEMO-001.');
        return;
      }

      google.script.run
        .withSuccessHandler(function (card) {
          currentCard = normalizeCard(card);
          renderInitial(currentCard);
        })
        .withFailureHandler(function (error) {
          renderError('No se pudo cargar la tarjeta: ' + getErrorMessage(error));
        })
        .getCardById(currentCardId);
    }

    function getCardIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const idFromUrl = cleanTemplateValue(params.get('id'));
      const idFromServer = cleanTemplateValue(SERVER_CARD_ID);

      return idFromUrl || idFromServer || '';
    }

    function cleanTemplateValue(value) {
      const text = String(value || '').trim();

      if (!text || text.indexOf('<?=') !== -1 || text.indexOf('<?') !== -1) {
        return '';
      }

      return text;
    }

    function normalizeCard(card) {
      const safeCard = card || {};

      const currentPoints = Number(safeCard.currentPoints) || 0;
      const goalPoints = Math.max(Number(safeCard.goalPoints) || 10, 1);
      const totalVisits = Number(safeCard.totalVisits) || 0;
      const progressPercent = Math.min(Math.round((currentPoints / goalPoints) * 100), 100);
      const rewardAvailable = currentPoints >= goalPoints;

      return {
        id: safeCard.id || currentCardId,
        businessName: safeCard.businessName || 'Terraza 65',
        customerName: safeCard.customerName || 'Cliente',
        program: safeCard.program || 'Tarjeta de fidelización digital',
        currentPoints: currentPoints,
        goalPoints: goalPoints,
        reward: safeCard.reward || 'Recompensa especial',
        level: safeCard.level || calculateLevel(totalVisits),
        totalVisits: totalVisits,
        status: rewardAvailable ? 'Recompensa disponible' : (safeCard.status || 'En progreso'),
        progressPercent: progressPercent,
        rewardAvailable: rewardAvailable,
        updatedAt: safeCard.updatedAt || getToday(),
        history: Array.isArray(safeCard.history) ? safeCard.history : [],
        redeemRequested: Boolean(safeCard.redeemRequested)
      };
    }

    function renderInitial(card) {
      renderMainInitial(card);
      renderSideInitial();
      cacheElements();
      setupProgressCircle();
      updateCardUI(card, true);
    }

    function renderMainInitial(card) {
      const mainContent = document.getElementById('mainContent');

      mainContent.innerHTML = `
        <div class="top">
          <div class="brand">
            <div class="brand-icon">A</div>
            <div>
              <h1 class="business-name" id="businessName"></h1>
              <p class="program" id="programName"></p>
            </div>
          </div>

          <div class="status-pill" id="statusPill"></div>
        </div>

        <div class="desktop-layout">
          <div class="progress-area">
            <div class="ring" id="progressRing">
              <svg class="progress-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="progress-track" cx="60" cy="60" r="52"></circle>
                <circle class="progress-value" id="progressCircle" cx="60" cy="60" r="52"></circle>
              </svg>

              <div class="ring-inner">
                <div class="points"><span id="currentPoints"></span><span>/<span id="goalPoints"></span></span></div>
                <div class="points-text">PUNTOS</div>
              </div>
            </div>

            <p class="helper-text" id="helperText"></p>
            <div class="reward-message" id="rewardMessage"></div>
          </div>

          <div class="info-area">
            <div class="client-box">
              <div class="client-label">Tarjeta asignada a</div>
              <h2 class="client-name" id="customerName"></h2>

              <div class="client-meta">
                <span>Nivel: <span class="level" id="levelText"></span></span>
                <span>Actualizado: <span id="updatedAt"></span></span>
              </div>
            </div>

            <div class="stars" id="starsContainer"></div>

            <div class="reward-box" id="rewardBox">
              <div class="gift">🎁</div>
              <div>
                <small>Recompensa al completar la tarjeta</small>
                <strong id="rewardText"></strong>
              </div>
            </div>

            <div id="messageBox" class="message"></div>
            <div id="syncStatus" class="sync-status"></div>
          </div>
        </div>
      `;

      const starsContainer = document.getElementById('starsContainer');
      const frag = document.createDocumentFragment();

      for (let i = 1; i <= card.goalPoints; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.dataset.index = String(i);
        star.dataset.active = '0';
        frag.appendChild(star);
      }

      starsContainer.appendChild(frag);
    }

    function renderSideInitial() {
      const sideContent = document.getElementById('sideContent');

      sideContent.innerHTML = `
        <div class="side-box">
          <p class="side-title">Resumen</p>

          <div class="stats">
            <div class="stat">
              <strong id="totalVisits"></strong>
              <span>Visitas registradas</span>
            </div>

            <div class="stat">
              <strong id="summaryPoints"></strong>
              <span>Puntos acumulados</span>
            </div>

            <div class="stat">
              <strong id="remainingPoints"></strong>
              <span>Puntos faltantes</span>
            </div>
          </div>
        </div>

        <div class="side-box">
          <p class="side-title">Acciones</p>

          <div class="actions">
            <button type="button" class="button button-green" id="simulateBtn">
              Simular compra
            </button>

            <button type="button" class="button button-yellow" id="redeemBtn">
              Canjear recompensa
            </button>

            <button type="button" class="button button-dark" id="resetBtn">
              Reiniciar
            </button>
          </div>
        </div>

        <div class="side-box">
          <p class="side-title">Actividad reciente</p>

          <div class="history" id="historyContainer"></div>
        </div>
      `;

      document.getElementById('simulateBtn').addEventListener('click', simulatePurchaseFast);
      document.getElementById('redeemBtn').addEventListener('click', redeemRewardFast);
      document.getElementById('resetBtn').addEventListener('click', resetDemoFast);
    }

    function cacheElements() {
      refs = {
        businessName: document.getElementById('businessName'),
        programName: document.getElementById('programName'),
        statusPill: document.getElementById('statusPill'),
        currentPoints: document.getElementById('currentPoints'),
        goalPoints: document.getElementById('goalPoints'),
        customerName: document.getElementById('customerName'),
        levelText: document.getElementById('levelText'),
        updatedAt: document.getElementById('updatedAt'),
        rewardText: document.getElementById('rewardText'),
        rewardMessage: document.getElementById('rewardMessage'),
        totalVisits: document.getElementById('totalVisits'),
        summaryPoints: document.getElementById('summaryPoints'),
        remainingPoints: document.getElementById('remainingPoints'),
        helperText: document.getElementById('helperText'),
        rewardBox: document.getElementById('rewardBox'),
        progressCircle: document.getElementById('progressCircle'),
        redeemBtn: document.getElementById('redeemBtn'),
        historyContainer: document.getElementById('historyContainer'),
        messageBox: document.getElementById('messageBox'),
        syncStatus: document.getElementById('syncStatus'),
        redeemOverlay: document.getElementById('redeemOverlay'),
        redeemOverlayIcon: document.getElementById('redeemOverlayIcon'),
        redeemOverlayTitle: document.getElementById('redeemOverlayTitle'),
        redeemOverlayText: document.getElementById('redeemOverlayText')
      };

      starElements = Array.prototype.slice.call(document.querySelectorAll('.star'));
      historySignature = '';
    }

    function setupProgressCircle() {
      if (!refs.progressCircle) {
        return;
      }

      refs.progressCircle.style.strokeDasharray = String(RING_CIRCUMFERENCE);
      refs.progressCircle.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
    }

    function updateCardUI(card, forceHistory) {
      const remaining = Math.max(card.goalPoints - card.currentPoints, 0);

      setText('businessName', card.businessName);
      setText('programName', card.program);
      setText('statusPill', card.status);
      setText('currentPoints', card.currentPoints);
      setText('goalPoints', card.goalPoints);
      setText('customerName', card.customerName);
      setText('levelText', card.level);
      setText('updatedAt', card.updatedAt);
      setText('rewardText', card.reward);
      setText('rewardMessage', card.progressPercent + '% completado');
      setText('totalVisits', card.totalVisits);
      setText('summaryPoints', card.currentPoints);
      setText('remainingPoints', remaining);

      setText(
        'helperText',
        card.rewardAvailable
          ? '¡Felicidades! Ya puedes canjear tu recompensa.'
          : 'Estás muy cerca de tu recompensa.'
      );

      if (refs.statusPill) {
        refs.statusPill.classList.toggle('ready', card.rewardAvailable);
      }

      if (refs.rewardBox) {
        refs.rewardBox.classList.toggle('available', card.rewardAvailable);
      }

      updateProgressCircle(card.progressPercent);

      if (refs.redeemBtn) {
        refs.redeemBtn.disabled = !card.rewardAvailable;
      }

      updateStars(card);
      updateHistory(card, forceHistory);
    }

    function updateProgressCircle(progressPercent) {
      if (!refs.progressCircle) {
        return;
      }

      const safePercent = Math.max(0, Math.min(Number(progressPercent) || 0, 100));
      const offset = RING_CIRCUMFERENCE - ((safePercent / 100) * RING_CIRCUMFERENCE);
      refs.progressCircle.style.strokeDashoffset = String(offset);
    }

    function updateStars(card) {
      for (let i = 0; i < starElements.length; i++) {
        const star = starElements[i];
        const index = Number(star.dataset.index) || 0;
        const active = index <= card.currentPoints;
        const newState = active ? '1' : '0';

        if (star.dataset.active === newState) {
          continue;
        }

        star.dataset.active = newState;
        star.classList.toggle('active', active);
        star.textContent = active ? '★' : '';
      }
    }

    function updateHistory(card, force) {
      const container = refs.historyContainer;
      if (!container) return;

      const safeHistory = Array.isArray(card.history) ? card.history.slice(0, 5) : [];
      const signature = safeHistory.length
        ? safeHistory.map(function (item) {
            return String(item.title || '') + '|' + String(item.detail || '') + '|' + String(item.date || '');
          }).join('||')
        : 'empty|' + String(card.goalPoints);

      if (!force && signature === historySignature) {
        return;
      }

      historySignature = signature;
      container.textContent = '';

      if (!safeHistory.length) {
        container.appendChild(createHistoryItem('Meta de recompensa', card.goalPoints + ' puntos'));
        return;
      }

      const frag = document.createDocumentFragment();

      safeHistory.forEach(function (item) {
        frag.appendChild(createHistoryItem(item.title || '', item.detail || ''));
      });

      container.appendChild(frag);
    }

    function createHistoryItem(title, detail) {
      const item = document.createElement('div');
      const titleEl = document.createElement('span');
      const detailEl = document.createElement('strong');

      item.className = 'history-item';
      titleEl.textContent = title;
      detailEl.textContent = detail;

      item.appendChild(titleEl);
      item.appendChild(detailEl);

      return item;
    }

    function simulatePurchaseFast() {
      if (!currentCard) {
        return;
      }

      if (currentCard.currentPoints >= currentCard.goalPoints) {
        showMessage('Ya tienes una recompensa disponible. Puedes canjearla para iniciar otra tarjeta.', 'success');
        return;
      }

      currentCard.currentPoints += 1;
      currentCard.totalVisits += 1;
      currentCard.level = calculateLevel(currentCard.totalVisits);
      currentCard.progressPercent = Math.min(Math.round((currentCard.currentPoints / currentCard.goalPoints) * 100), 100);
      currentCard.rewardAvailable = currentCard.currentPoints >= currentCard.goalPoints;
      currentCard.status = currentCard.rewardAvailable ? 'Recompensa disponible' : 'En progreso';
      currentCard.updatedAt = getToday();

      addHistory('Compra registrada', '+1 punto');

      requestAnimationFrame(function () {
        updateCardUI(currentCard, true);

        if (currentCard.rewardAvailable) {
          showMessage('¡Tarjeta completa! La recompensa ya está disponible.', 'success');
        } else {
          showMessage('Compra simulada. Se agregó 1 punto.', 'success');
        }
      });

      saveCardInBackground();
    }

    function redeemRewardFast() {
      if (redeemFlowActive) {
        return;
      }

      if (!currentCard || !currentCard.rewardAvailable) {
        showMessage('Todavía no tienes suficientes puntos para canjear.', 'error');
        return;
      }

      redeemFlowActive = true;
      setActionButtonsDisabled(true);
      showRedeemOverlay(
        'loading',
        'Enviando solicitud',
        'Estamos registrando el canje de tu recompensa.'
      );

      setTimeout(function () {
        currentCard.currentPoints = 0;
        currentCard.progressPercent = 0;
        currentCard.rewardAvailable = false;
        currentCard.status = 'En progreso';
        currentCard.updatedAt = getToday();
        currentCard.redeemRequested = true;
        currentCard.lastRedeemRequestAt = getToday();

        addHistory('Solicitud de canje enviada', currentCard.reward);

        requestAnimationFrame(function () {
          updateCardUI(currentCard, true);
          showRedeemOverlay(
            'success',
            'Solicitud de canje enviada',
            'El negocio revisará y aprobará tu recompensa.'
          );
          showMessage('Solicitud de canje enviada.', 'success');
          saveCardInBackground();
        });

        setTimeout(function () {
          hideRedeemOverlay();
          redeemFlowActive = false;
          setActionButtonsDisabled(false);

          if (refs.redeemBtn) {
            refs.redeemBtn.disabled = !currentCard.rewardAvailable;
          }
        }, 3700);
      }, 850);
    }

    function showRedeemOverlay(state, title, text) {
      const overlay = refs.redeemOverlay || document.getElementById('redeemOverlay');
      const icon = refs.redeemOverlayIcon || document.getElementById('redeemOverlayIcon');
      const titleEl = refs.redeemOverlayTitle || document.getElementById('redeemOverlayTitle');
      const textEl = refs.redeemOverlayText || document.getElementById('redeemOverlayText');

      if (!overlay || !icon || !titleEl || !textEl) {
        return;
      }

      icon.className = 'redeem-icon ' + (state === 'success' ? 'success' : 'loading');
      icon.textContent = state === 'success' ? '✓' : '•';
      titleEl.textContent = title;
      textEl.textContent = text;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function hideRedeemOverlay() {
      const overlay = refs.redeemOverlay || document.getElementById('redeemOverlay');

      if (!overlay) {
        return;
      }

      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    function setActionButtonsDisabled(disabled) {
      const buttons = document.querySelectorAll('#simulateBtn, #redeemBtn, #resetBtn');

      buttons.forEach(function (button) {
        button.disabled = disabled;
      });
    }

    function resetDemoFast() {
      if (!currentCard) {
        return;
      }

      currentCard.currentPoints = 0;
      currentCard.totalVisits = 0;
      currentCard.level = calculateLevel(0);
      currentCard.progressPercent = 0;
      currentCard.rewardAvailable = false;
      currentCard.status = 'En progreso';
      currentCard.updatedAt = getToday();
      currentCard.redeemRequested = false;
      currentCard.lastRedeemRequestAt = '';
      currentCard.history = [
        {
          title: 'Tarjeta reiniciada',
          detail: currentCard.customerName || 'Cliente',
          date: getToday()
        }
      ];

      requestAnimationFrame(function () {
        updateCardUI(currentCard, true);
        showMessage('Tarjeta reiniciada.', 'success');
      });

      saveCardInBackground();
    }

    function saveCardInBackground() {
      if (!currentCard || !currentCard.id) {
        return;
      }

      clearTimeout(saveTimer);

      saveTimer = setTimeout(function () {
        setSyncStatus('Guardando...');

        google.script.run
          .withSuccessHandler(function () {
            setSyncStatus('Guardado');
            setTimeout(function () {
              setSyncStatus('');
            }, 1200);
          })
          .withFailureHandler(function () {
            setSyncStatus('Cambios visibles, pero no se pudieron guardar');
          })
          .saveCardById(currentCard);
      }, 900);
    }

    function addHistory(title, detail) {
      if (!Array.isArray(currentCard.history)) {
        currentCard.history = [];
      }

      currentCard.history.unshift({
        title: title,
        detail: detail,
        date: getToday()
      });

      currentCard.history = currentCard.history.slice(0, 6);
    }

    function calculateLevel(totalVisits) {
      const visits = Number(totalVisits) || 0;

      if (visits >= 20) {
        return 'Diamante';
      }

      if (visits >= 10) {
        return 'Oro';
      }

      if (visits >= 5) {
        return 'Plata';
      }

      return 'Nuevo';
    }

    function showMessage(text, type) {
      const box = refs.messageBox || document.getElementById('messageBox');

      if (!box) {
        return;
      }

      clearTimeout(messageTimer);

      box.textContent = text;
      box.className = 'message show ' + type;

      messageTimer = setTimeout(function () {
        box.className = 'message';
        box.textContent = '';
      }, 2200);
    }

    function setSyncStatus(text) {
      const status = refs.syncStatus || document.getElementById('syncStatus');

      if (!status) {
        return;
      }

      const newText = text || '';

      if (status.textContent !== newText) {
        status.textContent = newText;
      }
    }

    function setText(id, value) {
      const element = refs[id] || document.getElementById(id);

      if (!element) {
        return;
      }

      const newText = value === null || value === undefined ? '' : String(value);

      if (element.textContent !== newText) {
        element.textContent = newText;
      }
    }

    function getToday() {
      const date = new Date();
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();

      return `${day}/${month}/${year}`;
    }

    function getErrorMessage(error) {
      if (!error) {
        return 'Error desconocido.';
      }

      return error.message || String(error);
    }

    function renderError(message) {
      const mainContent = document.getElementById('mainContent');

      if (!mainContent) {
        return;
      }

      mainContent.innerHTML = `
        <div style="text-align:center; padding:40px 10px;">
          <h2>No se pudo cargar</h2>
          <p style="color:#a7b0be;">${escapeHtml(message)}</p>
        </div>
      `;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return '';
      }

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>";

    if (idTarjeta) {
      const conector = urlFinal.includes('?') ? '&' : '?';
      urlFinal += conector + "id=" + encodeURIComponent(idTarjeta);
    }

    document.getElementById('mi-tarjeta').src = urlFinal;
  </script>

</body>
