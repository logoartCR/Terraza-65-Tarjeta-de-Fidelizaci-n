<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Faviconlogoart.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Tarjeta Digital de Fidelización</title>
  <meta name="description" content="Consulta tu tarjeta digital de fidelización y el avance de tu recompensa.">

  <!-- Open Graph (Vista previa en WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tarjeta Digital de Fidelización">
  <meta property="og:description" content="Consulta tu tarjeta digital de fidelización y el avance de tu recompensa.">
  <meta property="og:url" content="https://logoartcr.github.io/Terraza-65-Tarjeta-de-Fidelizaci-n/">
  <meta property="og:image" content="https://logoartcr.github.io/Terraza-65-Tarjeta-de-Fidelizaci-n/Faviconlogoart.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f4f4;
    }

    #mi-catalogo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="mi-catalogo" src=""></iframe>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const idProyecto = (urlParams.get('id') || '').trim();

    let urlFinal = "https://script.google.com/macros/s/AKfycbyR4BzLEg3ztar94tu32sdqQAVPjAT8BuFdKuPMy_C5ziaja-z0dLeE78IkhIwThZp_/exec";

    if (idProyecto) {
      const conector = urlFinal.includes('?') ? '&' : '?';
      urlFinal += conector + "id=" + encodeURIComponent(idProyecto);
    }

    document.getElementById('mi-catalogo').src = urlFinal;
  </script>

</body>
</html>
